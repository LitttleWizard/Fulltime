<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fulltime — Sports Match Prediction</title>
  <meta name="description" content="Elo and Dixon-Coles match prediction for the Premier League and NFL, rebuilt from real results in your browser." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0c0f;
      --surface: #131519;
      --border-strong: rgba(255,255,255,0.18);
      --text:    #f0f0f0;
      --brand:   #28cc95;
      --brand-dim: rgba(40,204,149,0.12);
      --brand-border: rgba(40,204,149,0.45);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }

    .center { text-align: center; padding: 24px; }

    h1 {
      font-size: clamp(58px, 15vw, 180px);
      font-weight: 800; letter-spacing: -0.05em; line-height: 1;
      color: #fff;
      margin-bottom: clamp(28px, 5vh, 48px);
    }

    .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px; letter-spacing: 0.06em;
      color: var(--text); text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 100px; padding: 13px 34px;
      transition: color .18s, border-color .18s, background .18s, transform .18s;
    }
    .btn:hover, .btn:focus-visible {
      color: var(--brand);
      border-color: var(--brand-border);
      background: var(--brand-dim);
      transform: translateY(-2px);
      outline: none;
    }
  </style>
</head>
<body>

  <main class="center">
    <h1>Fulltime</h1>
    <div class="buttons">
      <a class="btn" href="epl.html">EPL</a>
      <a class="btn" href="nfl.html">NFL</a>
    </div>
  </main>

</body>
</html>
